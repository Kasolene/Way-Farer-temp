name: Build BDNB bat

on:
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download BDNB 11 and 34
        run: |
          set -e
          curl -fL --retry 3 -o bdnb_11.zip "https://open-data.s3.fr-par.scw.cloud/bdnb_millesime_2026-02-a/millesime_2026-02-a_dep11/open_data_millesime_2026-02-a_dep11_csv.zip"
          curl -fL --retry 3 -o bdnb_34.zip "https://open-data.s3.fr-par.scw.cloud/bdnb_millesime_2026-02-a/millesime_2026-02-a_dep34/open_data_millesime_2026-02-a_dep34_csv.zip"

      - name: Extract and normalize CSV layout
        run: |
          set -e
          rm -rf bdnb_11 bdnb_34
          mkdir -p bdnb_11 bdnb_34
          unzip -q bdnb_11.zip -d bdnb_11
          unzip -q bdnb_34.zip -d bdnb_34
          find bdnb_11 -mindepth 2 -type f \( -iname '*.csv' -o -iname '*.csv.gz' \) -exec cp {} bdnb_11/ \;
          find bdnb_34 -mindepth 2 -type f \( -iname '*.csv' -o -iname '*.csv.gz' \) -exec cp {} bdnb_34/ \;

      - name: Run BDNB filter
        run: |
          set -o pipefail
          node filtrer-bdnb.js ./bdnb_11 ./bdnb_34 ./bat | tee build.log

      - name: Package result
        run: |
          zip -r bat.zip bat >/dev/null
          du -h bat.zip | tee -a build.log
          du -sh bat | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: bdnb-bat
          path: |
            bat.zip
            build.log
          if-no-files-found: error
