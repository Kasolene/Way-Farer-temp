name: Inspect BDNB 34

on:
  pull_request:
    branches: [develop]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download BDNB 34 CSV
        run: |
          curl -fL --retry 3 -o bdnb_34.zip "https://open-data.s3.fr-par.scw.cloud/bdnb_millesime_2026-02-a/millesime_2026-02-a_dep34/open_data_millesime_2026-02-a_dep34_csv.zip"
          mkdir -p bdnb_34
          unzip -q bdnb_34.zip -d bdnb_34

      - name: Inspect BDNB 34
        run: node filtrer-bdnb.js --inspect ./bdnb_34 | tee bdnb34-inspect.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bdnb34-inspect
          path: bdnb34-inspect.txt
          if-no-files-found: error
