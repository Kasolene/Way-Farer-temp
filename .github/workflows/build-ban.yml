name: Build filtered BAN

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download BAN departments
        run: |
          mkdir -p data/ban
          curl -fL --retry 3 -o data/ban/adresses-11.csv.gz https://adresse.data.gouv.fr/data/ban/adresses/latest/csv/adresses-11.csv.gz
          curl -fL --retry 3 -o data/ban/adresses-34.csv.gz https://adresse.data.gouv.fr/data/ban/adresses/latest/csv/adresses-34.csv.gz

      - name: Filter BAN
        run: node filtrer-ban.js ./data/ban ./ban

      - name: Zip result
        run: zip -r ban.zip ban

      - uses: actions/upload-artifact@v4
        with:
          name: ban-filtered
          path: ban.zip
          if-no-files-found: error
